# Spring Boot Configuration
spring.application.name=java-jarvis
server.port=8000
# Set web application type to reactive for Spring Cloud Gateway
spring.main.web-application-type=reactive

# Disable DataSource auto-configuration since this is just a gateway service
# v10 补充：排除 SimpleDiscoveryClientAutoConfiguration（Spring Cloud 2025.0 引用 Spring Boot 3.x 的 WebServerInitializedEvent）
# v10 补充：排除 LifecycleMvcEndpointAutoConfiguration（Spring Cloud 2025.1 与 Boot 4.0 的 MvcEndpoint 不兼容）
# v10 补充：排除 grpc-spring-boot-starter 2.15.0 全部自动配置（net.devh 2.15.0 引用 Boot 3.x 的 CompositeMeterRegistryAutoConfiguration，
#           该类在 Boot 4.0 中已迁移包路径。需排除主配置类 GrpcClientAutoConfiguration/GrpcServerAutoConfiguration 以截断 @Import 链。
#           后续应迁移至 Spring 官方 spring-boot-starter-grpc-server 1.0.x）
# v10 修正：版本对齐 SAA 2.0.0-M1.1 + Spring AI 2.0.0-M1 后，移除 McpClientAutoConfiguration 排除项（不再需要）。
#           保留 DashScopeMultimodalEmbeddingAutoConfiguration 排除：SAA 2.0.0-M1.1 的 autoconfigure.imports
#           声明了该类但 jar 中无此 class，属 SAA 本身缺陷。
# v10 补充：排除 SaaStudioWebModuleAutoConfiguration——Studio 的 AgentController 需要 AgentLoader bean，
#           项目通过编程式 ReactAgentConfig 注册 Agent 而非 Studio 注册机制，AgentLoader 缺失导致启动失败。
#           spring.ai.alibaba.studio.enabled=false 属性无法阻止该自动配置注册（无 @ConditionalOnProperty），
#           必须通过 exclude 排除。后续如需启用 Studio，需按 Studio 规范注册 Agent 或提供 AgentLoader 实现。
spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.orm.jpa.autoconfigure.HibernateJpaAutoConfiguration,org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration,com.alibaba.cloud.ai.autoconfigure.dashscope.DashScopeMultimodalEmbeddingAutoConfiguration,com.alibaba.cloud.ai.agent.studio.SaaStudioWebModuleAutoConfiguration,com.alibaba.cloud.ai.agent.nacos.config.NacosAgentConfig,org.springframework.cloud.client.discovery.simple.SimpleDiscoveryClientAutoConfiguration,org.springframework.cloud.autoconfigure.LifecycleMvcEndpointAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientMetricAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientTraceAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientHealthAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcClientSecurityAutoConfiguration,net.devh.boot.grpc.client.autoconfigure.GrpcDiscoveryClientAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcServerAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcServerMetricAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcServerTraceAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcHealthServiceAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcMetadataNacosConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcServerFactoryAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcAdviceAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcMetadataConsulConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcMetadataEurekaConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcMetadataZookeeperConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcReflectionServiceAutoConfiguration,net.devh.boot.grpc.server.autoconfigure.GrpcServerSecurityAutoConfiguration
spring.main.allow-bean-definition-overriding=true

# Nacos Configuration
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.cloud.nacos.discovery.namespace=public

# Spring AI DashScope Configuration (通义千问)
spring.ai.dashscope.api-key=${DASHSCOPE_API_KEY:sk-placeholder}
spring.ai.dashscope.chat.options.model=qwen-plus
spring.ai.dashscope.chat.options.temperature=0.7
spring.ai.dashscope.embedding.options.model=text-embedding-v2

# Spring AI Milvus VectorStore
spring.ai.vectorstore.milvus.client.host=${MILVUS_HOST:localhost}
spring.ai.vectorstore.milvus.client.port=${MILVUS_PORT:19530}
spring.ai.vectorstore.milvus.client.username=${MILVUS_USERNAME:root}
spring.ai.vectorstore.milvus.client.password=${MILVUS_PASSWORD:Milvus}
spring.ai.vectorstore.milvus.database-name=default
spring.ai.vectorstore.milvus.collection-name=jarvis_knowledge
spring.ai.vectorstore.milvus.embedding-dimension=1536
spring.ai.vectorstore.milvus.index-type=IVF_FLAT
spring.ai.vectorstore.milvus.metric-type=COSINE

# Spring AI Qdrant VectorStore（v10 补全：skills-meta 路由 qdrant）
spring.ai.vectorstore.qdrant.host=${QDRANT_HOST:localhost}
spring.ai.vectorstore.qdrant.port=${QDRANT_PORT:6333}
spring.ai.vectorstore.qdrant.use-tls=false
spring.ai.vectorstore.qdrant.collection-name=jarvis_skills_meta

# Spring AI Alibaba Studio（v10 补全：可视化调试，仅本地启用）
# v10 修正：SAA 2.0.0-M1.1 的 Studio AgentController 需要 AgentLoader bean，
#           项目通过编程式 ReactAgentConfig 注册 Agent 而非 Studio 注册机制，
#           导致 AgentLoader 缺失。先禁用 Studio 以解除启动阻塞，后续可按 Studio
#           规范注册 Agent 或提供 AgentLoader 实现后再启用。
spring.ai.alibaba.studio.enabled=false
spring.ai.alibaba.studio.server.port=8080

# Spring AI Graph Observation（v10 补全：Graph 执行链路追踪）
spring.ai.alibaba.graph.observation.enabled=true

# Actuator + Prometheus（v10 补全：指标暴露端点）
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=java-jarvis

# Jarvis 自定义配置开关
jarvis.agent.framework=saa-react
jarvis.tool.mode=hybrid
jarvis.memory.mode=hybrid
jarvis.memory.retrieval.enabled=true
jarvis.memory.retrieval.top-k=5
jarvis.vector-store.type=milvus
jarvis.vector-store.routing.knowledge=milvus
jarvis.vector-store.routing.chat-memory=milvus
jarvis.vector-store.routing.user-profile=milvus
jarvis.vector-store.routing.skills-meta=qdrant
jarvis.text-to-sql.engine=data-agent
jarvis.prompt.source=template
jarvis.advisor.enable.logging=true
jarvis.advisor.enable.sensitive-input=true
jarvis.advisor.enable.sensitive-output=true
jarvis.advisor.enable.rag=false
jarvis.advisor.enable.memory=true

# ChatMemory 三层压缩配置
chat.memory.compress.threshold=20
chat.memory.preserve-recent=5
chat.memory.assistant.keep-count=10
chat.memory.assistant.trim-threshold=30
chat.memory.max-messages=50


